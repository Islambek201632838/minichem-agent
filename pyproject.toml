[project]
name = "minichem"
version = "0.1.0"
description = "Small multi-agent chemistry assistant (LangGraph supervisor + RDKit tools + MCP)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.5",
    "langchain==1.5.0",
    "langchain-core==1.8.0",
    "langchain-google-genai==4.5.0",
    "langchain-mcp-adapters==0.3.2",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "mcp==1.30.0",
    "prometheus-client==0.26.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "rdkit==2026.9.2",
    "requests==2.34.2",
    "streamlit==1.67.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "C4", "RET", "PT"]
